name: Deploy prod

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or tag to deploy
        required: true
        default: main

permissions:
  contents: read
  id-token: write

concurrency:
  group: sql-deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.AZURE_CONFIGURED == 'true'
    environment: prod
    runs-on: [self-hosted, linux, x64, azure-sql-private]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: azure/login@v2 # Dependabot tracks major tag
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build DACPAC
        shell: pwsh
        run: ./scripts/Build-Dacpac.ps1
      - name: Install SqlPackage
        shell: bash
        run: |
          if dotnet tool list --global | grep -q '^microsoft.sqlpackage '; then
            dotnet tool update --global microsoft.sqlpackage --version 170.5.96
          else
            dotnet tool install --global microsoft.sqlpackage --version 170.5.96
          fi
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Publish DACPAC
        shell: pwsh
        run: |
          $token = az account get-access-token --resource https://database.windows.net/ --query accessToken -o tsv
          ./scripts/Deploy-Dacpac.ps1 -Dacpac (Get-ChildItem artifacts/dacpac/*.dacpac).FullName -ServerName '${{ vars.AZURE_SQL_SERVER }}' -DatabaseName '${{ vars.AZURE_SQL_DATABASE }}' -AccessToken $token -BlockOnPossibleDataLoss
      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prod-deployment-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 90
